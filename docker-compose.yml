services:

  backend:
    build: ./backend

    ports:
      - "8000:8000"

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

  db:
    image: postgres:17

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: