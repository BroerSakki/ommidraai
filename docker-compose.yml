services:
  backend:
    build: ./backend

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      - db

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    restart: unless-stopped

    depends_on:
      - backend

  db:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: